<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOC Coverage Map — Sign in</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/styles.css?v=95" />
</head>
<body>
  <div class="login-shell">
    <div class="login-card">

      <!-- Defender Logo -->
      <div class="login-logo">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none" aria-hidden="true">
          <path d="M18 3L6 8.25v6.75c0 7.875 5 15.255 12 17.25 7-1.995 12-9.375 12-17.25V8.25L18 3z" fill="#0078d4"/>
          <path d="M18 3L6 8.25v6.75c0 7.875 5 15.255 12 17.25V3z" fill="#106ebe" opacity="0.55"/>
          <path d="M23 14.5l-6.5 6.5-3-3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <div class="login-logo-text">SOC Coverage Map</div>
          <div class="login-logo-sub">MITRE ATT&amp;CK</div>
        </div>
      </div>

      <h1 class="login-heading">Sign in</h1>
      <p class="login-subtitle">Hesabınızla giriş yapın.</p>

      <form id="loginForm" class="login-form">
        <div class="login-field">
          <label for="username">Kullanıcı Adı</label>
          <input id="username" type="text" autocomplete="username" required placeholder="kullanıcı adı" />
        </div>
        <div class="login-field">
          <label for="password">Şifre</label>
          <input id="password" type="password" autocomplete="current-password" required placeholder="şifre" />
        </div>
        <button class="login-submit" type="submit">Giriş Yap</button>
        <div id="loginError" class="login-error"></div>
      </form>

    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('loginError');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      if (!res.ok) {
        const payload = await res.json().catch(() => ({}));
        errorEl.textContent = payload.error || 'Giriş başarısız.';
        return;
      }
      window.location.href = '/';
    });
  </script>
</body>
</html>
